name: Deploy Aurora Blog

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build backend
        run: |
          cd aurora-springboot
          mvn clean package -DskipTests -q

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Build blog frontend
        run: |
          cd aurora-vue/aurora-blog
          npm install
          npm run build

      - name: Build admin frontend
        run: |
          cd aurora-vue/aurora-admin
          npm install
          npm run build

      - name: Upload backend JAR
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: aurora-springboot/target/aurora-springboot-0.0.1.jar
          target: /tmp/aurora-deploy

      - name: Upload blog dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: aurora-vue/aurora-blog/dist
          target: /tmp/aurora-deploy/blog

      - name: Upload admin dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: aurora-vue/aurora-admin/dist
          target: /tmp/aurora-deploy/admin

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 部署后端 JAR
            if [ -f /tmp/aurora-deploy/aurora-springboot/target/aurora-springboot-0.0.1.jar ]; then
              echo "部署后端..."
              cp /tmp/aurora-deploy/aurora-springboot/target/aurora-springboot-0.0.1.jar /usr/local/aurora-springboot/
              PID=$(ps -ef | grep aurora-springboot | grep -v grep | awk '{print $2}')
              if [ ! -z "$PID" ]; then kill -9 $PID; fi
              cd /usr/local/aurora-springboot && sh start.sh
              echo "后端部署完成"
            fi

            # 部署博客前端
            if [ -d /tmp/aurora-deploy/blog/dist ]; then
              echo "部署博客前端..."
              rm -rf /data/aurora-vue/blog/*
              cp -r /tmp/aurora-deploy/blog/dist/* /data/aurora-vue/blog/
              echo "博客前端部署完成"
            fi

            # 部署管理后台
            if [ -d /tmp/aurora-deploy/admin/dist ]; then
              echo "部署管理后台..."
              rm -rf /data/aurora-vue/admin/*
              cp -r /tmp/aurora-deploy/admin/dist/* /data/aurora-vue/admin/
              echo "管理后台部署完成"
            fi

            # 清理
            rm -rf /tmp/aurora-deploy
            echo "全部部署完成！"
